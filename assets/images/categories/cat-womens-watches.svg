<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fad0c4"/>
      <stop offset="40%" stop-color="#ffd1ff"/>
      <stop offset="70%" stop-color="#e29578"/>
      <stop offset="100%" stop-color="#b0725c"/>
    </linearGradient>
    <radialGradient id="pearlDial" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8edeb"/>
      <stop offset="100%" stop-color="#e8e8e4"/>
    </radialGradient>
    <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#b0725c" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Slim Rose Gold Mesh Band -->
  <path d="M 87 18 L 113 18 L 110 65 L 90 65 Z" fill="url(#roseGold)"/>
  <path d="M 90 135 L 110 135 L 113 182 L 87 182 Z" fill="url(#roseGold)"/>
  <line x1="94" y1="20" x2="94" y2="60" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
  <line x1="106" y1="20" x2="106" y2="60" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
  <line x1="94" y1="140" x2="94" y2="180" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
  <line x1="106" y1="140" x2="106" y2="180" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>

  <!-- Delicate Bezel with Crystal Settings -->
  <circle cx="100" cy="100" r="42" fill="url(#roseGold)" filter="url(#gentleGlow)"/>
  
  <!-- Pavé Crystal Halo -->
  <circle cx="100" cy="100" r="38" fill="#ffffff" stroke="#e29578" stroke-width="1"/>
  <circle cx="100" cy="100" r="35" fill="url(#pearlDial)"/>

  <!-- Crystal Indices -->
  <circle cx="100" cy="72" r="1.8" fill="#e29578"/>
  <circle cx="128" cy="100" r="1.8" fill="#e29578"/>
  <circle cx="100" cy="128" r="1.8" fill="#e29578"/>
  <circle cx="72" cy="100" r="1.8" fill="#e29578"/>
  
  <circle cx="120" cy="80" r="1.2" fill="#d8b4e2"/>
  <circle cx="120" cy="120" r="1.2" fill="#d8b4e2"/>
  <circle cx="80" cy="120" r="1.2" fill="#d8b4e2"/>
  <circle cx="80" cy="80" r="1.2" fill="#d8b4e2"/>

  <!-- Jeweled Crown -->
  <rect x="140" y="97" width="4" height="6" rx="1.5" fill="url(#roseGold)"/>
  <circle cx="144" cy="100" r="1.5" fill="#f4978e"/>

  <!-- Sleek Leaf Hands -->
  <path d="M 100 100 Q 94 90 92 84 Q 96 88 100 100 Z" fill="#b0725c"/>
  <path d="M 100 100 Q 108 92 114 86 Q 108 94 100 100 Z" fill="#b0725c"/>
  <circle cx="100" cy="100" r="2.2" fill="#e29578"/>
</svg>
