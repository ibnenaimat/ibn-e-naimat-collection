<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="60%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#99751e"/>
    </linearGradient>
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Luxury Presentation Gift Box (Isometric Angled / Front) -->
  <rect x="52" y="78" width="96" height="74" rx="8" fill="url(#boxBlue)" filter="url(#giftShadow)"/>
  
  <!-- Lid Overhang -->
  <rect x="48" y="66" width="104" height="20" rx="6" fill="#182030" stroke="#d4af37" stroke-width="1.2"/>

  <!-- Vertical Gold Ribbon -->
  <rect x="93" y="66" width="14" height="86" fill="url(#goldRibbon)"/>
  <line x1="100" y1="66" x2="100" y2="152" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>

  <!-- Horizontal Gold Ribbon on Lid -->
  <rect x="48" y="72" width="104" height="8" fill="url(#goldRibbon)"/>

  <!-- Ornate Luxury Bow on Top -->
  <!-- Left Loop -->
  <path d="M 100 66 C 85 45 62 48 70 62 C 78 70 94 66 100 66 Z" fill="url(#goldRibbon)"/>
  <path d="M 100 66 C 88 50 72 52 76 60" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>

  <!-- Right Loop -->
  <path d="M 100 66 C 115 45 138 48 130 62 C 122 70 106 66 100 66 Z" fill="url(#goldRibbon)"/>
  <path d="M 100 66 C 112 50 128 52 124 60" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>

  <!-- Ribbon Knot Center -->
  <ellipse cx="100" cy="66" rx="7" ry="5.5" fill="#f5d77f"/>

  <!-- Ribbon Tails Flowing Down -->
  <path d="M 97 68 Q 88 80 84 94 L 92 92 Q 95 82 98 70 Z" fill="url(#goldRibbon)"/>
  <path d="M 103 68 Q 112 80 116 94 L 108 92 Q 105 82 102 70 Z" fill="url(#goldRibbon)"/>

  <!-- Sparkles / Stars -->
  <polygon points="144,52 146,56 150,58 146,60 144,64 142,60 138,58 142,56" fill="#f5d77f"/>
  <polygon points="56,60 57,63 60,64 57,65 56,68 55,65 52,64 55,63" fill="#f5d77f"/>
</svg>
