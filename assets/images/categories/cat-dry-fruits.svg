<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="60%" stop-color="#2c1e14"/>
      <stop offset="100%" stop-color="#19100a"/>
    </linearGradient>
    <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Wooden Luxury Bowl Base -->
  <path d="M 45 110 Q 50 155 100 155 Q 150 155 155 110 Z" fill="url(#bowlGrad)" filter="url(#bowlShadow)"/>
  <ellipse cx="100" cy="110" rx="55" ry="14" fill="#382518" stroke="#d4af37" stroke-width="1.2"/>

  <!-- Assortment of Premium Dry Fruits Heaped in Bowl -->
  
  <!-- Walnut Halves -->
  <ellipse cx="78" cy="98" rx="14" ry="11" fill="#8c5835" transform="rotate(-15, 78, 98)"/>
  <path d="M 72 94 Q 78 100 84 96 Q 78 104 72 98" fill="none" stroke="#52321c" stroke-width="1.2"/>
  
  <!-- Kashmiri Almonds -->
  <path d="M 112 92 Q 102 78 116 72 Q 126 84 112 92 Z" fill="#b07d58" stroke="#7a4f32" stroke-width="0.8"/>
  <path d="M 92 84 Q 85 70 98 66 Q 106 78 92 84 Z" fill="#c48f68" stroke="#7a4f32" stroke-width="0.8"/>
  <path d="M 132 98 Q 126 84 138 80 Q 146 92 132 98 Z" fill="#b07d58" stroke="#7a4f32" stroke-width="0.8"/>

  <!-- Roasted Cashews -->
  <path d="M 104 102 C 104 94 116 94 118 102 C 114 108 108 106 104 102 Z" fill="#faedcd" stroke="#d4a373" stroke-width="0.75"/>
  <path d="M 86 112 C 86 104 98 104 100 112 C 96 118 90 116 86 112 Z" fill="#faedcd" stroke="#d4a373" stroke-width="0.75"/>

  <!-- Iranian Pistachios -->
  <!-- Shell 1 -->
  <ellipse cx="118" cy="112" rx="10" ry="7" fill="#e9d8a6" stroke="#c4b087" stroke-width="0.8"/>
  <ellipse cx="118" cy="112" rx="6" ry="4" fill="#606c38"/>
  
  <!-- Dried Figs (Anjeer) -->
  <circle cx="62" cy="104" r="8" fill="#582f0e"/>
  <circle cx="62" cy="104" r="3" fill="#ddb892"/>

  <!-- Golden Bowl Rim Highlight -->
  <ellipse cx="100" cy="110" rx="54" ry="12" fill="none" stroke="#f6bd60" stroke-width="1" opacity="0.6"/>
</svg>
