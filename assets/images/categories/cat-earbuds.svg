<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="earbudsCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </linearGradient>
    <linearGradient id="earbudStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ced4da"/>
    </linearGradient>
    <filter id="caseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Open Charging Case Base -->
  <rect x="55" y="85" width="90" height="70" rx="28" fill="url(#earbudsCase)" filter="url(#caseShadow)"/>
  
  <!-- LED Status Indicator (Glowing Green) -->
  <circle cx="100" cy="120" r="2.5" fill="#22c55e"/>

  <!-- Pair of Pro Wireless Earbuds floating above -->
  <!-- Left Earbud -->
  <g transform="translate(74, 55)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#earbudStem)"/>
    <ellipse cx="-4" cy="0" rx="7" ry="9" fill="#1e2024"/>
    <!-- Stem -->
    <rect x="-3" y="6" width="7" height="32" rx="3.5" fill="url(#earbudStem)"/>
    <!-- Gold Contact -->
    <rect x="-2" y="36" width="5" height="2" fill="#d4af37"/>
    <!-- Mic grille -->
    <circle cx="0" cy="18" r="1.2" fill="#6c757d"/>
  </g>

  <!-- Right Earbud -->
  <g transform="translate(126, 55)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#earbudStem)"/>
    <ellipse cx="4" cy="0" rx="7" ry="9" fill="#1e2024"/>
    <!-- Stem -->
    <rect x="-4" y="6" width="7" height="32" rx="3.5" fill="url(#earbudStem)"/>
    <!-- Gold Contact -->
    <rect x="-3" y="36" width="5" height="2" fill="#d4af37"/>
    <!-- Mic grille -->
    <circle cx="0" cy="18" r="1.2" fill="#6c757d"/>
  </g>

  <!-- Sound Waves (Subtle Gold) -->
  <path d="M 44 50 Q 38 65 44 80" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 156 50 Q 162 65 156 80" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
