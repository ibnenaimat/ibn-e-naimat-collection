<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="walletLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2616"/>
      <stop offset="50%" stop-color="#24160c"/>
      <stop offset="100%" stop-color="#140b06"/>
    </linearGradient>
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae899"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#99751e"/>
    </linearGradient>
    <filter id="execShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Gentleman Executive Bifold Leather Wallet -->
  <rect x="42" y="80" width="76" height="58" rx="8" fill="url(#walletLeather)" filter="url(#execShadow)"/>
  <!-- Stitching -->
  <rect x="45" y="83" width="70" height="52" rx="6" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <!-- Gold Corner Accent -->
  <polygon points="106,80 118,80 118,92" fill="url(#penGold)"/>

  <!-- Minimalist Dress Watch in Set (Top Right) -->
  <g transform="translate(132, 75)">
    <rect x="-8" y="-45" width="16" height="90" rx="2" fill="#140b06"/>
    <circle cx="0" cy="0" r="28" fill="url(#penGold)" filter="url(#execShadow)"/>
    <circle cx="0" cy="0" r="25" fill="#0f1115"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="-6" y2="-10" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="-6" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="#d4af37"/>
  </g>

  <!-- Executive Metallic Gold Rollerball Pen (Laying across diagonally) -->
  <g transform="translate(100, 130) rotate(-35)">
    <!-- Pen Barrel -->
    <rect x="-60" y="-3.5" width="120" height="7" rx="3.5" fill="#121418" stroke="url(#penGold)" stroke-width="1"/>
    <!-- Pen Cap & Clip -->
    <rect x="-20" y="-4" width="45" height="8" rx="2" fill="url(#penGold)"/>
    <rect x="-16" y="4" width="28" height="2" rx="1" fill="#ffffff"/>
    <!-- Nib -->
    <polygon points="58,-3 68,0 58,3" fill="url(#penGold)"/>
    <!-- Gold Trim Rings -->
    <line x1="25" y1="-4" x2="25" y2="4" stroke="#ffffff" stroke-width="1.2"/>
  </g>
</svg>
