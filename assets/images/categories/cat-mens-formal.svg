<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="formalGoldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#99751e"/>
    </radialGradient>
    <linearGradient id="formalStrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a0f"/>
      <stop offset="100%" stop-color="#120b06"/>
    </linearGradient>
    <linearGradient id="formalDial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1c22"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Leather Straps -->
  <path d="M 82 15 L 118 15 L 114 62 L 86 62 Z" fill="url(#formalStrap)" rx="2"/>
  <path d="M 86 138 L 114 138 L 118 185 L 82 185 Z" fill="url(#formalStrap)" rx="2"/>
  <line x1="88" y1="20" x2="88" y2="58" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="112" y1="20" x2="112" y2="58" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="88" y1="142" x2="88" y2="180" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="112" y1="142" x2="112" y2="180" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Case & Bezel -->
  <circle cx="100" cy="100" r="48" fill="url(#formalGoldGrad)" filter="url(#softGlow)"/>
  <circle cx="100" cy="100" r="44" fill="#0d0e12"/>
  <circle cx="100" cy="100" r="41" fill="url(#formalDial)"/>
  <circle cx="100" cy="100" r="39" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.4"/>

  <!-- Crown and Pushers -->
  <rect x="146" y="96" width="6" height="8" rx="1.5" fill="url(#formalGoldGrad)"/>
  <rect x="143" y="80" width="5" height="5" rx="1" fill="#c49b28"/>
  <rect x="143" y="115" width="5" height="5" rx="1" fill="#c49b28"/>

  <!-- Roman Hour Markers -->
  <text x="100" y="73" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#f5d77f" text-anchor="middle">XII</text>
  <text x="100" y="133" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#f5d77f" text-anchor="middle">VI</text>
  <text x="70" y="102" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#f5d77f" text-anchor="middle">IX</text>
  <text x="130" y="102" font-family="'Cinzel', serif" font-size="7" font-weight="700" fill="#f5d77f" text-anchor="middle">III</text>

  <!-- Subdials -->
  <circle cx="100" cy="116" r="8" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="86" cy="98" r="7" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="114" cy="98" r="7" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>

  <!-- Watch Hands -->
  <line x1="100" y1="100" x2="88" y2="84" stroke="#f5d77f" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="118" y2="78" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="100" y2="124" stroke="#e63946" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="2.5" fill="#f5d77f"/>
</svg>
