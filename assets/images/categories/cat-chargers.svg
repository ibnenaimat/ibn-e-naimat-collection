<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="50%" stop-color="#1c1f24"/>
      <stop offset="100%" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="goldCable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae899"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#99751e"/>
    </linearGradient>
    <filter id="chargerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- GaN Fast Charger Block -->
  <rect x="52" y="65" width="58" height="74" rx="12" fill="url(#chargerBody)" filter="url(#chargerShadow)"/>
  
  <!-- Metallic US/UK Folding Prongs -->
  <rect x="70" y="44" width="6" height="22" rx="2" fill="#adb5bd"/>
  <rect x="86" y="44" width="6" height="22" rx="2" fill="#adb5bd"/>

  <!-- Ports on Bottom -->
  <rect x="68" y="112" width="12" height="4.5" rx="1.5" fill="#00f2fe"/>
  <rect x="68" y="122" width="12" height="4.5" rx="1.5" fill="#d4af37"/>
  <text x="96" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#a1a1aa">65W GaN</text>

  <!-- Braided Gold USB-C Cable (Looping elegantly around) -->
  <path d="M 120 160 C 150 160 165 130 160 90 C 155 60 135 60 125 75 C 115 90 120 125 140 140 C 150 148 155 160 140 165" 
        fill="none" stroke="url(#goldCable)" stroke-width="5" stroke-linecap="round"/>

  <!-- Gold Anodized USB-C Metal Connector Head -->
  <rect x="135" y="156" width="22" height="10" rx="3" fill="#1c1f24" stroke="#d4af37" stroke-width="1.5"/>
  <rect x="157" y="158" width="6" height="6" rx="1.5" fill="#adb5bd"/>
  
  <!-- Fast Charge Lightning Bolt Symbol -->
  <polygon points="76,82 84,82 81,90 87,90 77,102 79,93 74,93" fill="#00f2fe"/>
</svg>
