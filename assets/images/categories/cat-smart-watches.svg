<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="smartStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242e"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>
    <linearGradient id="smartBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404756"/>
      <stop offset="50%" stop-color="#2a303c"/>
      <stop offset="100%" stop-color="#171a21"/>
    </linearGradient>
    <radialGradient id="oledScreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Seamless Sport Loop Strap -->
  <path d="M 80 15 L 120 15 L 118 64 L 82 64 Z" fill="url(#smartStrap)" rx="3"/>
  <path d="M 82 136 L 118 136 L 120 185 L 80 185 Z" fill="url(#smartStrap)" rx="3"/>

  <!-- Squircle / Rounded Smart Case -->
  <rect x="58" y="58" width="84" height="84" rx="24" fill="url(#smartBody)" filter="url(#screenGlow)"/>
  <rect x="62" y="62" width="76" height="76" rx="20" fill="url(#oledScreen)"/>

  <!-- Digital Crown & Side Button -->
  <rect x="142" y="74" width="4" height="14" rx="2" fill="#5a6275"/>
  <rect x="142" y="98" width="3" height="12" rx="1.5" fill="#3a3f4d"/>

  <!-- UI Display Rings -->
  <!-- Activity Ring 1: Cyan -->
  <circle cx="100" cy="100" r="26" fill="none" stroke="#16202c" stroke-width="3"/>
  <circle cx="100" cy="100" r="26" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="120,40" stroke-linecap="round"/>

  <!-- Activity Ring 2: Magenta / Gold -->
  <circle cx="100" cy="100" r="21" fill="none" stroke="#251b24" stroke-width="3"/>
  <circle cx="100" cy="100" r="21" fill="none" stroke="#fa709a" stroke-width="3" stroke-dasharray="90,40" stroke-linecap="round"/>

  <!-- Heart Rate / Time Display -->
  <text x="100" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">10:42</text>
  
  <!-- Heart Icon & Steps -->
  <path d="M 94 105 C 94 103 92 102 91 103 C 90 102 88 103 88 105 C 88 107 91 109 91 109 C 91 109 94 107 94 105 Z" fill="#ff4d4f"/>
  <text x="104" y="109" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#a1a1aa" text-anchor="middle">78 BPM</text>

  <!-- Battery Indicator -->
  <rect x="94" y="74" width="12" height="4" rx="1" fill="none" stroke="#22c55e" stroke-width="0.75"/>
  <rect x="95" y="75" width="8" height="2" fill="#22c55e"/>
</svg>
