<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sportsSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#495057"/>
      <stop offset="50%" stop-color="#6c757d"/>
      <stop offset="100%" stop-color="#212529"/>
    </linearGradient>
    <linearGradient id="sportsRubber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#0f1114"/>
    </linearGradient>
    <filter id="sportsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Textured Sports Silicone Strap -->
  <path d="M 80 14 L 120 14 L 115 60 L 85 60 Z" fill="url(#sportsRubber)"/>
  <rect x="85" y="24" width="30" height="3" rx="1.5" fill="#2d3139"/>
  <rect x="85" y="32" width="30" height="3" rx="1.5" fill="#2d3139"/>
  <rect x="85" y="40" width="30" height="3" rx="1.5" fill="#2d3139"/>
  
  <path d="M 85 140 L 115 140 L 120 186 L 80 186 Z" fill="url(#sportsRubber)"/>
  <rect x="85" y="148" width="30" height="3" rx="1.5" fill="#2d3139"/>
  <rect x="85" y="156" width="30" height="3" rx="1.5" fill="#2d3139"/>
  <rect x="85" y="164" width="30" height="3" rx="1.5" fill="#2d3139"/>

  <!-- Steel Rugged Case -->
  <circle cx="100" cy="100" r="50" fill="url(#sportsSteel)" filter="url(#sportsShadow)"/>
  
  <!-- Tachymeter Bezel -->
  <circle cx="100" cy="100" r="44" fill="#111215" stroke="#ff4d4f" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="38" fill="#181a1f"/>

  <!-- Bezel notches -->
  <circle cx="100" cy="59" r="1.5" fill="#ff4d4f"/>
  <circle cx="141" cy="100" r="1.5" fill="#ffffff"/>
  <circle cx="100" cy="141" r="1.5" fill="#ffffff"/>
  <circle cx="59" cy="100" r="1.5" fill="#ffffff"/>

  <!-- Chunky Crown with Guards -->
  <rect x="146" y="94" width="7" height="12" rx="2" fill="#495057"/>
  <polygon points="144,91 149,94 144,97" fill="#6c757d"/>
  <polygon points="144,103 149,106 144,109" fill="#6c757d"/>

  <!-- Bold Indices -->
  <rect x="98" y="65" width="4" height="8" rx="1" fill="#00f2fe"/>
  <rect x="98" y="127" width="4" height="8" rx="1" fill="#ffffff"/>
  <rect x="65" y="98" width="8" height="4" rx="1" fill="#ffffff"/>
  <rect x="127" y="98" width="8" height="4" rx="1" fill="#ffffff"/>

  <!-- Dial Features -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="#ff4d4f" stroke-width="1" opacity="0.8"/>
  <circle cx="100" cy="100" r="24" fill="none" stroke="#343a40" stroke-width="0.75" stroke-dasharray="2,3"/>

  <!-- Hands -->
  <line x1="100" y1="100" x2="80" y2="86" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="116" y2="76" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="100" y2="128" stroke="#ff4d4f" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="3" fill="#ff4d4f"/>
</svg>
