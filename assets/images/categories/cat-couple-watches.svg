<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="coupleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae899"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8323"/>
    </linearGradient>
    <linearGradient id="coupleDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <filter id="coupleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Men's Watch (Slightly larger, left/back) -->
  <g transform="translate(68, 96)">
    <!-- Strap -->
    <rect x="-14" y="-72" width="28" height="144" rx="2" fill="#1e2229"/>
    <!-- Case & Dial -->
    <circle cx="0" cy="0" r="42" fill="url(#coupleGold)" filter="url(#coupleShadow)"/>
    <circle cx="0" cy="0" r="38" fill="#121418"/>
    <circle cx="0" cy="0" r="35" fill="url(#coupleDark)"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="-10" y2="-16" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="-12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#d4af37"/>
    <!-- Markers -->
    <rect x="-1" y="-32" width="2" height="6" fill="#d4af37"/>
    <rect x="-1" y="26" width="2" height="6" fill="#d4af37"/>
    <rect x="-32" y="-1" width="6" height="2" fill="#d4af37"/>
  </g>

  <!-- Women's Watch (Slightly smaller, overlapping right/front) -->
  <g transform="translate(130, 110)">
    <!-- Strap -->
    <rect x="-10" y="-58" width="20" height="116" rx="2" fill="url(#coupleGold)"/>
    <!-- Case & Dial -->
    <circle cx="0" cy="0" r="32" fill="url(#coupleGold)" filter="url(#coupleShadow)"/>
    <circle cx="0" cy="0" r="28" fill="#ffffff"/>
    <circle cx="0" cy="0" r="25" fill="#fafafa"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="-8" y2="-12" stroke="#aa8323" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="-8" stroke="#aa8323" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#d4af37"/>
    <!-- Markers -->
    <circle cx="0" cy="-20" r="1.2" fill="#d4af37"/>
    <circle cx="0" cy="20" r="1.2" fill="#d4af37"/>
    <circle cx="-20" cy="0" r="1.2" fill="#d4af37"/>
    <circle cx="20" cy="0" r="1.2" fill="#d4af37"/>
  </g>

  <!-- Romantic Heart / Union Motif -->
  <path d="M 94 62 C 94 56 86 52 82 56 C 78 52 70 56 70 62 C 70 70 82 78 82 78 C 82 78 94 70 94 62 Z" fill="#d4af37" opacity="0.6"/>
</svg>
