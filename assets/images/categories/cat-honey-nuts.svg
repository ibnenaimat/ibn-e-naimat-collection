<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="60%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#d46b08"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="jarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#fb8500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Honey Jar Body -->
  <rect x="62" y="65" width="76" height="85" rx="14" fill="url(#honeyGrad)" filter="url(#jarShadow)"/>
  
  <!-- Glass Jar Highlight -->
  <rect x="65" y="68" width="16" height="78" rx="8" fill="url(#glassReflection)"/>

  <!-- Wooden Lid -->
  <rect x="58" y="52" width="84" height="15" rx="4" fill="#a0612c"/>
  <rect x="66" y="47" width="68" height="6" rx="2" fill="#bc6c25"/>

  <!-- Honeycomb Pattern inside Jar -->
  <g fill="none" stroke="#ffe8a1" stroke-width="1" opacity="0.45">
    <polygon points="100,82 108,86 108,95 100,99 92,95 92,86"/>
    <polygon points="116,91 124,95 124,104 116,108 108,104 108,95"/>
    <polygon points="84,91 92,95 92,104 84,108 76,104 76,95"/>
    <polygon points="100,100 108,104 108,113 100,117 92,113 92,104"/>
  </g>

  <!-- Whole Roasted Nuts Inside Honey -->
  <!-- Almond -->
  <path d="M 85 118 Q 78 110 82 100 Q 92 110 85 118 Z" fill="#6f4e37"/>
  <path d="M 85 118 Q 78 110 82 100 Q 92 110 85 118 Z" fill="none" stroke="#d4a373" stroke-width="0.8"/>
  <!-- Walnut -->
  <circle cx="114" cy="116" r="10" fill="#8c5a3c"/>
  <path d="M 110 110 Q 114 116 118 112 Q 114 122 110 118" fill="none" stroke="#583622" stroke-width="1.2"/>
  <!-- Cashew -->
  <path d="M 96 132 Q 104 128 106 134 Q 102 140 94 136 Z" fill="#faedcd"/>

  <!-- Honey Dipper Drips -->
  <line x1="130" y1="35" x2="115" y2="75" stroke="#bc6c25" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="115" cy="75" r="5" fill="#ffb703"/>
  <path d="M 115 80 Q 115 86 116 88 Q 117 90 115 92" fill="none" stroke="#ffb703" stroke-width="2.5" stroke-linecap="round"/>
</svg>
