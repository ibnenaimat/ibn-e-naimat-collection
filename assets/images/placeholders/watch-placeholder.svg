<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="#f8fafc"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="300" cy="300" r="230" fill="#f1f5f9" opacity="0.6"/>

  <!-- Watch Strap Top -->
  <path d="M 230 70 L 370 70 L 360 200 L 240 200 Z" fill="#334155" rx="8"/>
  <line x1="250" y1="100" x2="350" y2="100" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="250" y1="130" x2="350" y2="130" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="250" y1="160" x2="350" y2="160" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Watch Strap Bottom -->
  <path d="M 240 400 L 360 400 L 370 530 L 230 530 Z" fill="#334155" rx="8"/>
  <line x1="250" y1="440" x2="350" y2="440" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="250" y1="470" x2="350" y2="470" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="250" y1="500" x2="350" y2="500" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Watch Case & Bezel -->
  <circle cx="300" cy="300" r="145" fill="url(#watchGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.25))"/>
  <circle cx="300" cy="300" r="128" fill="url(#dialGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Crown Button -->
  <rect x="445" y="285" width="18" height="30" rx="4" fill="url(#goldGrad)"/>

  <!-- Hour Markers -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="185" x2="300" y2="202" stroke-width="5"/>
    <line x1="300" y1="415" x2="300" y2="398" stroke-width="5"/>
    <line x1="185" y1="300" x2="202" y2="300" stroke-width="5"/>
    <line x1="415" y1="300" x2="398" y2="300" stroke-width="5"/>
    <circle cx="355" cy="205" r="3" fill="#fbbf24"/>
    <circle cx="395" cy="245" r="3" fill="#fbbf24"/>
    <circle cx="395" cy="355" r="3" fill="#fbbf24"/>
    <circle cx="355" cy="395" r="3" fill="#fbbf24"/>
    <circle cx="245" cy="395" r="3" fill="#fbbf24"/>
    <circle cx="205" cy="355" r="3" fill="#fbbf24"/>
    <circle cx="205" cy="245" r="3" fill="#fbbf24"/>
    <circle cx="245" cy="205" r="3" fill="#fbbf24"/>
  </g>

  <!-- Watch Hands -->
  <!-- Hour hand -->
  <line x1="300" y1="300" x2="345" y2="250" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="300" y1="300" x2="300" y2="215" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="300" y1="320" x2="300" y2="205" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="7" fill="#fbbf24"/>
  <circle cx="300" cy="300" r="3" fill="#ef4444"/>

  <!-- Logo text placeholder inside dial -->
  <text x="300" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">ORIGINAL</text>
  <text x="300" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AUTOMATIC</text>

  <!-- Bottom Badge -->
  <g transform="translate(180, 535)">
    <rect width="240" height="34" rx="17" fill="#0f172a"/>
    <text x="120" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ORIGINAL BRANDED WATCH</text>
  </g>
</svg>
