<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#f0f9ff"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="300" cy="300" r="230" fill="#e0f2fe" opacity="0.6"/>

  <!-- Earbuds Charging Case -->
  <rect x="210" y="220" width="180" height="150" rx="40" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="3" filter="drop-shadow(0 20px 25px rgba(15, 23, 42, 0.2))"/>
  <!-- Case seam -->
  <line x1="210" y1="280" x2="390" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <!-- Status LED indicator -->
  <circle cx="300" cy="305" r="4" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
  <!-- Brand accent -->
  <rect x="280" y="235" width="40" height="4" rx="2" fill="#94a3b8"/>

  <!-- Wireless Earbud 1 (Left) -->
  <g transform="translate(130, 240) rotate(-15)">
    <circle cx="50" cy="50" r="32" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
    <circle cx="50" cy="45" r="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="8" fill="#475569"/>
    <!-- Stem -->
    <rect x="42" y="65" width="16" height="55" rx="8" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="46" y="110" width="8" height="6" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Wireless Earbud 2 (Right) -->
  <g transform="translate(390, 230) rotate(20)">
    <circle cx="50" cy="50" r="32" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
    <circle cx="50" cy="45" r="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="50" cy="45" r="8" fill="#475569"/>
    <!-- Stem -->
    <rect x="42" y="65" width="16" height="55" rx="8" fill="url(#caseGrad)" stroke="#94a3b8" stroke-width="2.5"/>
    <rect x="46" y="110" width="8" height="6" rx="2" fill="#fbbf24"/>
  </g>

  <!-- Braided Fast Charging Cable loop -->
  <path d="M 170 430 C 220 480 380 480 430 430" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-dasharray="4,2"/>
  <rect x="155" y="415" width="28" height="14" rx="4" fill="#0f172a"/>
  <rect x="145" y="418" width="12" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="417" y="415" width="28" height="14" rx="4" fill="#0f172a"/>
  <rect x="443" y="418" width="12" height="8" rx="2" fill="#cbd5e1"/>

  <!-- Specs Badges -->
  <g transform="translate(195, 140)">
    <rect width="210" height="30" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="105" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="1">BLUETOOTH 5.3 • FAST CHARGE</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(150, 535)">
    <rect width="300" height="34" rx="17" fill="#0369a1"/>
    <text x="150" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">MOBILE ACCESSORIES &amp; GADGETS</text>
  </g>
</svg>
