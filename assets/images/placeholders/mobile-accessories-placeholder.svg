<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="macBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c275"/>
      <stop offset="100%" stop-color="#b88d3c"/>
    </linearGradient>
    <linearGradient id="chargerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#macBg)"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#252d3d" stroke-width="2"/>
  <circle cx="300" cy="300" r="210" fill="#131822" stroke="#1f2737" stroke-width="1.5"/>

  <!-- Subtle glow ring -->
  <circle cx="300" cy="285" r="145" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" stroke-dasharray="8,6"/>

  <!-- Smartphone silhouette -->
  <rect x="210" y="140" width="180" height="310" rx="30" fill="url(#phoneGrad)" stroke="#334155" stroke-width="3"/>
  <!-- Screen bezel -->
  <rect x="220" y="152" width="160" height="286" rx="22" fill="#070a0f"/>
  <!-- Dynamic Island notch -->
  <rect x="270" y="162" width="60" height="12" rx="6" fill="#1a2234"/>

  <!-- MagSafe Magnetic Ring Graphic on Screen -->
  <circle cx="300" cy="285" r="55" fill="none" stroke="url(#goldAcc)" stroke-width="4" opacity="0.9"/>
  <rect x="296" y="348" width="8" height="22" rx="4" fill="url(#goldAcc)" opacity="0.9"/>
  <!-- Fast Charge Bolt Icon -->
  <path d="M 302 260 L 290 285 L 299 285 L 296 310 L 312 281 L 302 281 Z" fill="#38bdf8"/>

  <!-- Premium Fast Charging Adapter (Left bottom) -->
  <g transform="translate(90, 340)">
    <rect width="90" height="90" rx="18" fill="#1b2230" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="18" width="60" height="12" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="45" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle" font-weight="700">65W GaN</text>
    <rect x="25" y="42" width="40" height="8" rx="2" fill="#0f172a"/>
    <text x="45" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">USB-C PD</text>
  </g>

  <!-- Braided Gold-Tip Cable (Curving across) -->
  <path d="M 180 395 C 220 440 380 440 430 380" fill="none" stroke="url(#goldAcc)" stroke-width="5" stroke-linecap="round"/>
  <rect x="425" y="365" width="16" height="26" rx="4" fill="#334155" transform="rotate(25 425 365)"/>
  <rect x="432" y="352" width="8" height="14" rx="2" fill="url(#goldAcc)" transform="rotate(25 432 352)"/>

  <!-- Top Category Tag -->
  <g transform="translate(160, 65)">
    <rect width="280" height="34" rx="17" fill="#131926" stroke="#2a354b" stroke-width="1.5"/>
    <text x="140" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2c275" text-anchor="middle" letter-spacing="2">PREMIUM MOBILE ACCESSORIES</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(150, 520)">
    <rect width="300" height="38" rx="19" fill="#1a2336" stroke="#e2c275" stroke-width="1.5"/>
    <text x="150" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">CHARGERS • CASES • MOUNTS</text>
  </g>
</svg>
